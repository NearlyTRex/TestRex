name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests: a newer push supersedes their run. On main every run
  # finishes, since each push's secret scan covers only that push's commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@4a7f6e3f7dbda5bbe67fd2f25d6f03373ea5f811 # v0.2.25
    permissions:
      contents: read
    with:
      # The shell sandbox's tests build real user namespaces, which Ubuntu
      # runners restrict; skipped, they would leave the sandbox uncovered.
      # Not the shell-sandbox input: that loads Workflows' own copy of the
      # plugins, which would clash with the ones this package registers.
      # The Lua tests run every interpreter installed, and busted and luacheck
      commands: |
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        sudo apt-get update -q
        sudo apt-get install -y -q lua5.1 lua5.4 luajit lua-busted lua-check

  lint:
    name: Lint
    uses: NearlyTRex/Workflows/.github/workflows/lint.yml@4a7f6e3f7dbda5bbe67fd2f25d6f03373ea5f811 # v0.2.25
    permissions:
      contents: read
