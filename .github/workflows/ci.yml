name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests: a newer push supersedes their run. On main every run
  # finishes, since each push's secret scan covers only that push's commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@8d200aa1b1b0bf4bccd0f2fc17444ea21060457c # v0.2.18
    permissions:
      contents: read
    with:
      # The shell sandbox's tests build real user namespaces, which Ubuntu
      # runners restrict; skipped, they would leave the sandbox uncovered.
      # Not the shell-sandbox input: that loads Workflows' own copy of the
      # plugins, which would clash with the ones this package registers.
      commands: |
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi

  lint:
    name: Lint
    uses: NearlyTRex/Workflows/.github/workflows/lint.yml@8d200aa1b1b0bf4bccd0f2fc17444ea21060457c # v0.2.18
    permissions:
      contents: read
