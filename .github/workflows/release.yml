name: Release

# Tags and publishes the version in pyproject.toml once, after the checks pass:
# a GitHub Release with the sdist and wheel attached, then the same files on
# PyPI. Pushes that don't change the version find the tag already there, and
# run nothing else: CI has already tested them.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  pending:
    name: Pending
    uses: NearlyTRex/Workflows/.github/workflows/release-check.yml@8d200aa1b1b0bf4bccd0f2fc17444ea21060457c # v0.2.18
    permissions:
      contents: read
    with:
      version-file: pyproject.toml

  check:
    name: Check
    needs: pending
    if: needs.pending.outputs.pending == 'true'
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@8d200aa1b1b0bf4bccd0f2fc17444ea21060457c # v0.2.18
    permissions:
      contents: read

  build:
    name: Build
    needs: check
    uses: NearlyTRex/Workflows/.github/workflows/python-build.yml@8d200aa1b1b0bf4bccd0f2fc17444ea21060457c # v0.2.18
    permissions:
      contents: read

  release:
    name: Release
    needs: build
    uses: NearlyTRex/Workflows/.github/workflows/release.yml@8d200aa1b1b0bf4bccd0f2fc17444ea21060457c # v0.2.18
    permissions:
      contents: write
    with:
      version-file: pyproject.toml
      assets: dist
      checksums: true

  # A job of this file rather than a reusable workflow: PyPI's trusted
  # publisher names this file, release.yml, and the pypi environment, so no
  # token is stored, and it accepts no workflow called from another repository
  publish:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pytest-testrex/${{ needs.release.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: NearlyTRex/Workflows/actions/pypi-publish@8d200aa1b1b0bf4bccd0f2fc17444ea21060457c # v0.2.18
