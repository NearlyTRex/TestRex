name: Release

# Tags and publishes the version in pyproject.toml once, after the checks pass:
# a GitHub Release with the sdist and wheel attached, then the same files on
# PyPI. Pushes that don't change the version find the tag already there, and
# run nothing else: CI has already tested them.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  pending:
    name: Pending
    uses: NearlyTRex/Workflows/.github/workflows/release-check.yml@fbb6855b4044a6526d82092742b83fba5940a3f0 # v0.2.19
    permissions:
      contents: read
    with:
      version-file: pyproject.toml

  check:
    name: Check
    needs: pending
    if: needs.pending.outputs.pending == 'true'
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@fbb6855b4044a6526d82092742b83fba5940a3f0 # v0.2.19
    permissions:
      contents: read
    # The same inputs as the python job in ci.yml
    with:
      # The shell sandbox's tests build real user namespaces, which Ubuntu
      # runners restrict; skipped, they would leave the sandbox uncovered.
      # Not the shell-sandbox input: that loads Workflows' own copy of the
      # plugins, which would clash with the ones this package registers.
      commands: |
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi

  build:
    name: Build
    needs: check
    uses: NearlyTRex/Workflows/.github/workflows/python-build.yml@fbb6855b4044a6526d82092742b83fba5940a3f0 # v0.2.19
    permissions:
      contents: read

  release:
    name: Release
    needs: build
    uses: NearlyTRex/Workflows/.github/workflows/release.yml@fbb6855b4044a6526d82092742b83fba5940a3f0 # v0.2.19
    permissions:
      contents: write
    with:
      version-file: pyproject.toml
      assets: dist
      checksums: true

  # A job of this file rather than a reusable workflow: PyPI's trusted
  # publisher names this file, release.yml, and the pypi environment, so no
  # token is stored, and it accepts no workflow called from another repository
  publish:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pytest-testrex/${{ needs.release.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: NearlyTRex/Workflows/actions/pypi-publish@fbb6855b4044a6526d82092742b83fba5940a3f0 # v0.2.19
