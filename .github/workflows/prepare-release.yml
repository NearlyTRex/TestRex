name: Prepare Release

# Bumps the version and opens a PR. Merging it lets release.yml tag and publish.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch, minor, major, or an exact version like 1.4.0
        required: true
        default: patch

permissions: {}

jobs:
  prepare:
    name: Prepare
    uses: NearlyTRex/Workflows/.github/workflows/prepare-release.yml@8d200aa1b1b0bf4bccd0f2fc17444ea21060457c # v0.2.18
    permissions:
      contents: write
      pull-requests: write
    with:
      bump: ${{ inputs.bump }}
      version-file: pyproject.toml
