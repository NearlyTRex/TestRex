[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-testrex"
version = "0.1.3"
description = "A pytest plugin that holds a test suite to one layout and one standard of test quality"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pytest>=8",
    "pylint>=3",
]

classifiers = [
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
# The parser shell coverage reads scripts with
shell = [
    "tree-sitter",
    "tree-sitter-bash",
]

[project.urls]
Homepage = "https://github.com/NearlyTRex/TestRex"
Issues = "https://github.com/NearlyTRex/TestRex/issues"

[project.entry-points.pytest11]
testrex = "pytest_testrex.plugin"
testrex_shell_cov = "pytest_testrex.shell_cov"
testrex_shell_sandbox = "pytest_testrex.shell_sandbox"

[tool.setuptools]
packages = ["pytest_testrex"]

[tool.setuptools.package-data]
pytest_testrex = ["pylintrc"]

[tool.pytest.ini_options]
testpaths = ["Tests"]
# The tree mirrors the source, so unit/ and any later suite can hold files
# with the same basename, which the default prepend mode cannot import apart
addopts = "--strict-markers -ra --import-mode=importlib -p pytester"

[tool.coverage.run]
branch = true
source = ["pytest_testrex"]

[tool.coverage.report]
show_missing = true

[tool.testrex]
meta_dirs = ["unit/meta"]
# The meta suite runs over sample trees written by the tests themselves
min_test_files = 10
signature_packages = ["pytest_testrex"]
library_targets = ["pytest_testrex"]
# The shell plugins came from Workflows with docstrings; the rest uses comments
doc_style = "either"
doc_max_lines = 3
standards = [
    "no-print", "no-exit", "mutable-defaults", "bare-except", "import-time-io",
    "no-narration", "commented-out-code", "long-functions", "long-modules",
]
sealed_programs = ["sudo", "ssh"]

[tool.testrex.baseline]
# Functions nested past three levels; lowered as each is split, never raised
long-functions = 12
